  .card {
    width: min(90%, 420px);
    padding: 30px 24px;
    text-align: center;
    background: rgba(255,255,255,.90);
    border-radius: 24px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
    backdrop-filter: blur(5px);
  }

  h1 {
    margin: 0 0 10px;
    font-size: 28px;
  }

  .subtitle {
    margin: 0 0 22px;
    color: #555;
  }

  button {
    border: none;
    padding: 14px 24px;
    border-radius: 999px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #222;
    color: white;
    transition: .2s;
  }

  button:hover { transform: scale(1.06); }
  button:active { transform: scale(.96); }

  #pesan {
    display: none;
    margin-top: 22px;
    padding: 18px;
    border-radius: 16px;
    background: #fff3cd;
    color: #222;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.5;
    animation: muncul .35s ease;
  }

  @keyframes muncul {
    from { opacity: 0; transform: translateY(12px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
</head>

<body>
  <div class="card">
    <h1>📢 Pesan Penting Gais</h1>
    <p class="subtitle">Klik tombol di bawah kalau berani 😭</p>

    <button onclick="tampilkanPesan()">KLIK DI SINI 👇</button>

    <div id="pesan">
      Gais, amb jasjus gula 1 satu soalny amb dk glk arak
    </div>
  </div>

<script>
function tampilkanPesan() {
  const pesan = document.getElementById("pesan");
  pesan.style.display = "block";
}
</script>
</body>
